<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082F49"/>
      <stop offset="50%" stop-color="#0C4A6E"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle Grid Pattern -->
  <g stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Logo Emblem -->
  <g transform="translate(100, 110)">
    <text x="0" y="48" font-family="monospace, monospace" font-size="52" font-weight="300" fill="#7DD3FC">{</text>
    <circle cx="34" cy="30" r="7" fill="#0EA5E9"/>
    <circle cx="34" cy="30" r="14" fill="#0EA5E9" fill-opacity="0.3"/>
    <text x="48" y="48" font-family="monospace, monospace" font-size="52" font-weight="300" fill="#7DD3FC">}</text>
    <text x="85" y="46" font-family="sans-serif" font-size="34" font-weight="700" letter-spacing="6" fill="#FFFFFF">SATR</text>
    <text x="210" y="46" font-family="sans-serif" font-size="28" font-weight="500" fill="#38BDF8">سطر</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="280" font-family="sans-serif" font-size="64" font-weight="600" fill="#FFFFFF" letter-spacing="-1">
    Built from the first line.
  </text>

  <!-- Subheadline -->
  <text x="100" y="345" font-family="sans-serif" font-size="28" font-weight="400" fill="#BAE6FD">
    One partner. Every digital layer.
  </text>
  <text x="100" y="390" font-family="sans-serif" font-size="22" font-weight="300" fill="#7DD3FC">
    Web · Mobile · SaaS · Custom Software · E-Commerce · AI · Cloud
  </text>

  <!-- Bottom Details -->
  <g transform="translate(100, 520)">
    <rect width="220" height="42" rx="21" fill="#0369A1" stroke="#38BDF8" stroke-opacity="0.5"/>
    <text x="110" y="27" font-family="monospace, monospace" font-size="14" font-weight="600" fill="#E0F2FE" text-anchor="middle">satr.tech</text>
  </g>
</svg>
